mutation Login {
  login(email: "alice@contractor.test", password: "contractor123") {
    token
    user {
      id
      name
      role
    }
  }
}

query Me {
  me {
    id
    email
    name
    role
  }
}

mutation CreateJob {
  createJob(
    input: {
      description: "Kitchen remodel"
      location: { addressLine1: "1 Main St", city: "Austin", state: "TX", postalCode: "78701" }
      costCents: 2500000
    }
  ) {
    id
    status
    costCents
    version
    location {
      addressLine1
      city
      country
    }
  }
}

query Jobs {
  jobs(includeDeleted: false) {
    id
    description
    status
    costCents
    version
    contractor {
      name
    }
    homeowners {
      email
    }
  }
}

query Job($id: ID!) {
  job(id: $id) {
    id
    description
    status
    costCents
    version
    deletedAt
    location {
      addressLine1
      addressLine2
      city
      state
      postalCode
      country
    }
  }
}

mutation UpdateJob($id: ID!) {
  updateJob(id: $id, input: { status: IN_PROGRESS, costCents: 2750000, expectedVersion: 1 }) {
    id
    status
    costCents
    version
  }
}

mutation AddHomeowner($jobId: ID!) {
  addHomeowner(jobId: $jobId, email: "bob@homeowner.test") {
    id
    homeowners {
      id
      email
    }
  }
}

mutation RemoveHomeowner($jobId: ID!, $homeownerId: ID!) {
  removeHomeowner(jobId: $jobId, homeownerId: $homeownerId) {
    id
    homeowners {
      email
    }
  }
}

mutation DeleteJob($id: ID!) {
  deleteJob(id: $id, expectedVersion: 2) {
    id
    deletedAt
    version
  }
}
